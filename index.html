<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello, world — Habit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef3f4;
    --surface: #ffffff;
    --ink: #14263a;
    --muted: #5d7080;
    --line: #d5dfe3;
    --accent: #0a8f8a;
    --accent-ink: #ffffff;
    --danger: #b3382c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1b26;
      --surface: #162534;
      --ink: #e8f0f3;
      --muted: #8da2b2;
      --line: #2a3d4e;
      --accent: #2cc4bd;
      --accent-ink: #072523;
      --danger: #ff8b7d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; padding: 48px 20px 64px; }
  h1 {
    font-size: clamp(2.6rem, 10vw, 4.5rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
    margin: 0 0 8px;
  }
  .sub { color: var(--muted); margin: 0 0 32px; }

  form { display: flex; gap: 8px; margin-bottom: 24px; }
  input[type="text"] {
    flex: 1; min-width: 0;
    font: inherit; color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
  }
  button { font: inherit; cursor: pointer; }
  .add {
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 10px;
    padding: 12px 18px; font-weight: 600;
  }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .habit {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .name { font-weight: 600; font-size: 1.1rem; overflow-wrap: anywhere; }
  .streak { color: var(--muted); font-size: 0.9rem; white-space: nowrap; }
  .streak b { color: var(--accent); font-size: 1.1rem; }

  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 8px 0;
    background: transparent; color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 0.78rem;
  }
  .day.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .day.today:not(.done) { border-color: var(--ink); color: var(--ink); }
  .day .mark { font-size: 1rem; min-height: 1.2em; }

  .remove {
    background: none; border: 0; color: var(--muted);
    font-size: 0.85rem; margin-top: 10px; padding: 0; text-decoration: underline;
  }
  .remove:hover { color: var(--danger); }
  .empty { color: var(--muted); text-align: center; padding: 32px 0; }
  @media (prefers-reduced-motion: no-preference) {
    .day, .add { transition: background 0.15s, color 0.15s; }
  }
</style>
</head>
<body>
<main>
  <h1>Hello, world.</h1>
  <p class="sub">Add a habit, then tap a day to check it off.</p>

  <form id="form">
    <input type="text" id="input" placeholder="New habit, e.g. Read 10 pages" maxlength="60" aria-label="New habit name" autocomplete="off">
    <button class="add" type="submit">Add habit</button>
  </form>

  <section id="list" aria-live="polite"></section>
</main>

<script>
  const KEY = "hello-habits-v1";
  const DAY_LABELS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  let habits = [];
  try { habits = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { habits = []; }

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(habits)); } catch (e) {} };

  const dateKey = (d) =>
    d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");

  const lastDays = (n) => {
    const out = [];
    for (let i = n - 1; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      out.push(d);
    }
    return out;
  };

  function streakOf(habit) {
    const d = new Date();
    if (!habit.done[dateKey(d)]) d.setDate(d.getDate() - 1); // today not done yet: count from yesterday
    let count = 0;
    while (habit.done[dateKey(d)]) {
      count++;
      d.setDate(d.getDate() - 1);
    }
    return count;
  }

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function render() {
    const list = document.getElementById("list");
    list.replaceChildren();

    if (!habits.length) {
      list.append(el("p", "empty", "No habits yet. Add your first one above."));
      return;
    }

    const todayKey = dateKey(new Date());

    habits.forEach((habit) => {
      const card = el("article", "habit");

      const head = el("div", "head");
      head.append(el("span", "name", habit.name));
      const streak = el("span", "streak");
      const n = streakOf(habit);
      const b = el("b", null, String(n));
      streak.append(b, document.createTextNode(n === 1 ? " day streak" : " day streak"));
      head.append(streak);
      card.append(head);

      const days = el("div", "days");
      lastDays(7).forEach((d) => {
        const k = dateKey(d);
        const done = !!habit.done[k];
        const btn = el("button", "day" + (done ? " done" : "") + (k === todayKey ? " today" : ""));
        btn.type = "button";
        btn.setAttribute("aria-pressed", String(done));
        btn.setAttribute("aria-label", habit.name + ", " + d.toDateString() + (done ? ", done" : ", not done"));
        btn.append(el("span", null, k === todayKey ? "Today" : DAY_LABELS[d.getDay()]));
        btn.append(el("span", "mark", done ? "✓" : String(d.getDate())));
        btn.addEventListener("click", () => {
          if (habit.done[k]) delete habit.done[k]; else habit.done[k] = true;
          save();
          render();
        });
        days.append(btn);
      });
      card.append(days);

      const remove = el("button", "remove", "Delete habit");
      remove.type = "button";
      remove.addEventListener("click", () => {
        if (!confirm('Delete "' + habit.name + '"?')) return;
        habits = habits.filter((h) => h.id !== habit.id);
        save();
        render();
      });
      card.append(remove);

      list.append(card);
    });
  }

  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = document.getElementById("input");
    const name = input.value.trim();
    if (!name) return;
    habits.push({ id: Date.now().toString(36), name, done: {} });
    input.value = "";
    save();
    render();
  });

  render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mira Kale Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
/* Layout: single column, left-aligned editorial rhythm; projects as a filterable index with expandable rows */
:root{
  --bg:#E9ECF0; --surface:#F6F7F9; --fg:#15181E; --muted:#5B6370; --line:#C9CFD8; --accent:#B8741A; --accent-ink:#FFFFFF;
  --display:"Syne", "Helvetica Neue", Arial, sans-serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151A; --surface:#1A1E25; --fg:#E7EAEF; --muted:#9AA3B0; --line:#2D333D; --accent:#E3A24A; --accent-ink:#17120A; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151A; --surface:#1A1E25; --fg:#E7EAEF; --muted:#9AA3B0; --line:#2D333D; --accent:#E3A24A; --accent-ink:#17120A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--body);
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1040px;margin:0 auto}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

.demo{font:500 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  border:1px dashed var(--line);padding:8px 12px;border-radius:6px;display:inline-block;margin-top:20px}

header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:18px;border-bottom:1px solid var(--line)}
.logo{font:800 18px/1 var(--display);letter-spacing:-.02em}
.logo span{color:var(--accent)}
nav{display:flex;gap:20px;flex-wrap:wrap}
nav a{text-decoration:none;font-size:14px;color:var(--muted)}
nav a:hover{color:var(--fg)}

.hero{padding-block:72px 56px;display:grid;grid-template-columns:1.5fr 1fr;gap:48px;align-items:end}
.hero h1{font:800 clamp(44px,8vw,92px)/.95 var(--display);letter-spacing:-.04em;margin:0;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{color:var(--muted);max-width:42ch;margin:0 0 20px}
.avail{display:flex;align-items:center;gap:10px;font:500 13px/1 var(--mono)}
.dot{width:9px;height:9px;border-radius:50%;background:#2E9E5B;box-shadow:0 0 0 4px color-mix(in srgb,#2E9E5B 22%,transparent)}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.btn{font:600 14px/1 var(--body);padding:13px 18px;border-radius:999px;border:1px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--line)}
.stat{padding:22px 0}
.stat+.stat{padding-left:24px;border-left:1px solid var(--line)}
.stat b{display:block;font:700 32px/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}

section{padding-block:72px 8px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
h2{font:700 clamp(28px,4vw,40px)/1.1 var(--display);letter-spacing:-.03em;margin:0 0 28px;text-wrap:balance}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{font:500 13px/1 var(--mono);padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.proj{border-bottom:1px solid var(--line)}
.proj button.row{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;
  grid-template-columns:64px 1fr auto 28px;gap:16px;align-items:baseline;padding:22px 0}
.proj .yr{font:500 13px/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.proj h3{font:700 clamp(20px,2.6vw,26px)/1.2 var(--display);letter-spacing:-.02em;margin:0}
.proj .kind{font-size:14px;color:var(--muted)}
.proj .plus{font:400 22px/1 var(--mono);color:var(--accent);transition:transform .2s}
.proj.open .plus{transform:rotate(45deg)}
.proj .detail{display:grid;grid-template-columns:64px 1fr;gap:16px;padding-bottom:26px}
.proj .detail > div{grid-column:2;min-width:0;display:grid;grid-template-columns:1.4fr 1fr;gap:28px}
.proj .detail p{margin:0;max-width:60ch}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-content:start}
.tag{font:500 12px/1 var(--mono);padding:6px 9px;border-radius:5px;background:var(--surface);border:1px solid var(--line)}
.metric{font:600 14px/1.4 var(--body);color:var(--accent);margin-top:12px}

.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
.skills h4{font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.skills ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}

.timeline{display:grid;gap:0}
.job{display:grid;grid-template-columns:150px 1fr;gap:24px;padding:22px 0;border-top:1px solid var(--line)}
.job .when{font:500 13px/1.5 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.job h3{margin:0 0 4px;font:700 20px/1.25 var(--display)}
.job .co{color:var(--accent);font-weight:600;font-size:14px}
.job p{margin:8px 0 0;color:var(--muted);max-width:62ch}

.contact{display:grid;grid-template-columns:1fr 1fr;gap:48px;padding-bottom:40px}
form{display:grid;gap:14px}
label{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:grid;gap:8px}
input,textarea{font:16px/1.5 var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;width:100%}
textarea{min-height:120px;resize:vertical}
.note{font-size:14px;color:var(--accent);min-height:1.4em}
.mail{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font:500 15px/1 var(--mono);user-select:all}
footer{border-top:1px solid var(--line);padding-block:24px 40px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;gap:24px;padding-block:48px 40px}
  .skills,.contact{grid-template-columns:1fr}
  .proj button.row{grid-template-columns:44px 1fr 24px}
  .proj .kind{display:none}
  .proj .detail{grid-template-columns:44px 1fr}
  .proj .detail > div{grid-template-columns:1fr;gap:16px}
  .job{grid-template-columns:1fr;gap:6px}
  nav a:not(.keep){display:none}
  .stat+.stat{padding-left:14px}
  .stat b{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<script>
const { useState } = React;
const html = window.htm.bind(React.createElement);

const PROJECTS = [
  { yr:"2026", title:"Tidepool", kind:"Product · Web app", cat:"Product",
    text:"A shared budgeting app for flatmates. Splits rent and utilities automatically and nudges people before a bill is due rather than after.",
    metric:"Sample metric: 12k monthly users, 4.7 store rating", tags:["React","Node","Postgres","Stripe"] },
  { yr:"2025", title:"Fieldnote", kind:"Design system", cat:"Design",
    text:"A component library and token set for a fictional agri-tech company, built to work offline-first on low-end Android phones in the field.",
    metric:"Sample metric: 38 components, 2 themes", tags:["Figma","Storybook","CSS tokens"] },
  { yr:"2025", title:"Ledgerline", kind:"Open source · CLI", cat:"Open source",
    text:"A command-line tool that turns bank CSV exports into clean monthly reports, with rules you write in plain YAML.",
    metric:"Sample metric: 1.9k GitHub stars", tags:["TypeScript","CLI","YAML"] },
  { yr:"2024", title:"Monsoon Map", kind:"Data visualisation", cat:"Design",
    text:"An interactive map of rainfall across a decade, with a scrubber that lets readers compare any two years side by side.",
    metric:"Sample metric: featured in a design newsletter", tags:["D3","Canvas","Mapbox"] },
  { yr:"2023", title:"Queue Kit", kind:"Product · SaaS", cat:"Product",
    text:"Appointment queueing for small clinics. Patients join from a QR code and get an SMS when they are two places away.",
    metric:"Sample metric: average wait cut from 40 to 15 minutes", tags:["Next.js","Twilio","Redis"] },
];

const JOBS = [
  { when:"2024 — Now", role:"Senior Frontend Engineer", co:"Northwind Labs (fictional)", text:"Leads the web platform team. Rebuilt the checkout flow and set up the shared design system." },
  { when:"2021 — 2024", role:"Product Engineer", co:"Brightlane (fictional)", text:"Shipped the mobile web app from zero to launch with a team of four." },
  { when:"2019 — 2021", role:"Junior Developer", co:"Pixel & Pine Studio (fictional)", text:"Built marketing sites and small tools for agency clients." },
];

function Project({ p, open, onToggle }) {
  return html`<div class=${"proj" + (open ? " open" : "")}>
    <button class="row" onClick=${onToggle} aria-expanded=${open}>
      <span class="yr">${p.yr}</span>
      <h3>${p.title}</h3>
      <span class="kind">${p.kind}</span>
      <span class="plus" aria-hidden="true">+</span>
    </button>
    ${open && html`<div class="detail"><div>
      <div><p>${p.text}</p><div class="metric">${p.metric}</div></div>
      <div class="tags">${p.tags.map(t => html`<span class="tag" key=${t}>${t}</span>`)}</div>
    </div></div>`}
  </div>`;
}

function Contact() {
  const [note, setNote] = useState("");
  const [copied, setCopied] = useState(false);
  const email = "hello@mirakale.example";
  const copy = () => {
    navigator.clipboard?.writeText(email).then(() => setCopied(true), () => {});
  };
  const submit = e => {
    e.preventDefault();
    const name = e.target.elements.cname.value.trim();
    setNote(name ? `Thanks, ${name}. This is a demo form, so nothing was sent.` : "Add your name so I know who's writing.");
  };
  return html`<section id="contact" class="contact">
    <div>
      <div class="eyebrow">Contact</div>
      <h2>Have a project in mind? Let's talk.</h2>
      <div class="mail"><span>${email}</span>
        <button class="chip" onClick=${copy}>${copied ? "Copied" : "Copy"}</button></div>
    </div>
    <form onSubmit=${submit}>
      <label for="cname">Name<input id="cname" name="cname" placeholder="Your name"/></label>
      <label for="cemail">Email<input id="cemail" type="email" placeholder="you@example.com"/></label>
      <label for="cmsg">Message<textarea id="cmsg" placeholder="Tell me a little about the project"></textarea></label>
      <div><button class="btn primary" type="submit">Send message</button></div>
      <div class="note" role="status">${note}</div>
    </form>
  </section>`;
}

function App() {
  const cats = ["All", "Product", "Design", "Open source"];
  const [cat, setCat] = useState("All");
  const [open, setOpen] = useState(0);
  const list = PROJECTS.filter(p => cat === "All" || p.cat === cat);

  return html`<div class="wrap">
    <header class="nav">
      <div class="logo">mira<span>.</span>kale</div>
      <nav><a href="#work" class="keep">Work</a><a href="#skills">Skills</a><a href="#experience">Experience</a><a href="#contact" class="keep">Contact</a></nav>
    </header>

    <div class="demo">Sample portfolio · all names and numbers are placeholders</div>

    <div class="hero">
      <h1>I build calm, <em>useful</em> software.</h1>
      <div>
        <p>Mira Kale is a frontend engineer and product designer who turns messy everyday problems into simple interfaces.</p>
        <div class="avail"><span class="dot"></span>Open to freelance work</div>
        <div class="btns"><a class="btn primary" href="#work">See projects</a><a class="btn" href="#contact">Get in touch</a></div>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><b>7 yrs</b><span>building for the web</span></div>
      <div class="stat"><b>24</b><span>products shipped</span></div>
      <div class="stat"><b>3</b><span>open-source tools</span></div>
    </div>

    <section id="work">
      <div class="eyebrow">Selected work</div>
      <h2>Projects</h2>
      <div class="filters">
        ${cats.map(c => html`<button key=${c} class="chip" aria-pressed=${cat === c} onClick=${() => { setCat(c); setOpen(0); }}>${c}</button>`)}
      </div>
      ${list.map((p, i) => html`<${Project} key=${p.title} p=${p} open=${open === i} onToggle=${() => setOpen(open === i ? -1 : i)}/>`)}
    </section>

    <section id="skills">
      <div class="eyebrow">Toolkit</div>
      <h2>What I work with</h2>
      <div class="skills">
        <div><h4>Build</h4><ul><li>React & Next.js</li><li>TypeScript</li><li>Node.js</li><li>Postgres</li></ul></div>
        <div><h4>Design</h4><ul><li>Figma</li><li>Design systems</li><li>Prototyping</li><li>Accessibility</li></ul></div>
        <div><h4>Ship</h4><ul><li>Vercel</li><li>GitHub Actions</li><li>Analytics</li><li>User interviews</li></ul></div>
      </div>
    </section>

    <section id="experience">
      <div class="eyebrow">Experience</div>
      <h2>Where I've worked</h2>
      <div class="timeline">
        ${JOBS.map(j => html`<div class="job" key=${j.role}>
          <div class="when">${j.when}</div>
          <div><h3>${j.role}</h3><div class="co">${j.co}</div><p>${j.text}</p></div>
        </div>`)}
      </div>
    </section>

    <${Contact}/>

    <footer><span>© 2026 Mira Kale (fictional)</span><span>Built with React</span></footer>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
